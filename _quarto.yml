project:
  type: website
  output-dir: docs

website:
  title: "SDGIS"
  head-includes:
    - '<script async data-goatcounter="https://dcannatella.goatcounter.com/count" src="//gc.zgo.at/count.js"></script>' #analytics
  bread-crumbs: true
  announcement: 
    icon: info-circle
    dismissable: true
    content: "**Alert** - This website is under construction. Some content may not yet be available or may be out of date."
    type: primary
    position: below-navbar
    
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: pages/software-tools.qmd
        text: "Software & Tools"
      - text: "Learn QGIS"
        href: pages/learn-qgis/index.qmd
      - text: "Learn R"
        href: pages/learn-r.qmd
      - text: "Courses & Workshops"
        href: pages/courses/index.qmd
      - href: pages/find-data/index.qmd
        text: "Find Data"
      - href: pages/about.qmd
        text: "About"
    right:
      - href: pages/contact.qmd
        text: "Contact"
      - href: pages/contribute.qmd
        text: "Contribute"  
    tools:
      - icon: twitter
        href: https://twitter.com
      - icon: github
        menu:
          - text: Source Code
            href: https://github.com/sdgis-edu-tud/sdgis-edu-tud.github.io
          - text: Report a Bug
            href: https://github.com/sdgis-edu-tud/sdgis-edu-tud.github.io/issues

  sidebar:
    - id: qgis_tutorials
      title: "Learn QGIS"
      style: "floating"
      collapse-level: 1
      contents:
        - pages/learn-qgis/index.qmd
        - pages/learn-qgis/introduction.qmd
        
        - section: "Getting Started"
          contents:
            - pages/learn-qgis/getting-started/install-qgis.qmd
            - pages/learn-qgis/getting-started/switch-language.qmd
            - pages/learn-qgis/getting-started/activating-panels.qmd
            - pages/learn-qgis/getting-started/connecting-folders.qmd
            - pages/learn-qgis/getting-started/folder-structure.qmd
            - pages/learn-qgis/getting-started/installing-plugins.qmd
            - pages/learn-qgis/getting-started/new-project.qmd
            - pages/learn-qgis/getting-started/importing-vectors.qmd
            - pages/learn-qgis/getting-started/styling-vectors.qmd
            - pages/learn-qgis/getting-started/importing-rasters.qmd
            - pages/learn-qgis/getting-started/importing-tables.qmd
            
        - section: "Cartography & Mapping"
          contents:
            - pages/learn-qgis/cartography/index.qmd
            - pages/learn-qgis/cartography/making-a-map.qmd
            - pages/learn-qgis/cartography/principles.qmd
            - pages/learn-qgis/cartography/elements.qmd
            - pages/learn-qgis/cartography/layout.qmd
            - pages/learn-qgis/cartography/aesthetics.qmd
            - pages/learn-qgis/cartography/types.qmd
            - pages/learn-qgis/cartography/creating-in-qgis.qmd
            
        - section: "Density Analysis"
          contents:
            - pages/learn-qgis/density-analysis/index.qmd
            - pages/learn-qgis/density-analysis/land-cover-grid.qmd
            - pages/learn-qgis/density-analysis/tree-cover-grid.qmd
            - pages/learn-qgis/density-analysis/road-density-grid.qmd
            - pages/learn-qgis/density-analysis/hex-maps.qmd
            
        - section: "Landscape Analysis"
          contents:
            - pages/learn-qgis/landscape-analysis/index.qmd
            - pages/learn-qgis/landscape-analysis/working-with-terrain-data.qmd
            - pages/learn-qgis/landscape-analysis/dem-derivatives.qmd
            - pages/learn-qgis/landscape-analysis/hydrological-analysis.qmd
            - pages/learn-qgis/landscape-analysis/visibility.qmd
            - pages/learn-qgis/landscape-analysis/cross-profiles.qmd

  back-to-top-navigation: true
  reader-mode: true
  page-footer: 
    left: "Copyright 2025, SDGIS-BK@tudelft.nl"
    right: 
      - icon: github
        href: https://github.com/sdgis-edu-tud/sdgis-edu-tud.github.io
  page-navigation: true
  search: 
    location: navbar
    type: overlay

format:
  html:
    theme: 
      light: cosmo
      dark: cyborg 
    css: styles.css
    toc: true
    code-tools: true
    code-copy: true
    code-fold: show

editor: visual